<div class="container-xxl min-vh-100 d-flex align-items-center justify-content-center bg-dark">
  <div class="authentication-wrapper authentication-basic container-p-y w-100" style="max-width: 400px;">
    <div class="authentication-inner">
      <div class="card shadow-lg rounded-4" style="background-color: #0a2540; border: none;">
        <div class="card-body p-4">
          <div class="app-brand justify-content-center mb-4 d-flex">
            <img
              class="logo mx-auto"
              src="{{ url_for('static', filename='assets/img/logo.png') }}"
              alt="Logo"
              style="max-height: 60px;"
            />
          </div>

          <form
            id="formAuthentication"
            class="mb-3"
            action="{{ url_for('loginCliente') }}"
            method="POST"
            autocomplete="off"
          >
            <div class="mb-3">
              <label for="email_user" class="form-label text-white fw-semibold">Email</label>
              <input
                type="email"
                class="form-control bg-transparent border-1 border-secondary text-white"
                name="email_user"
                id="email_user"
                placeholder="Escribe tu email"
                autofocus
                required
                style="box-shadow: none;"
              />
            </div>

            <div class="mb-3 form-password-toggle">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label text-white fw-semibold" for="pass_user">Contraseña</label>
                <a href="{{ url_for('cpanelRecoveryPassUser') }}" class="text-info small text-decoration-none">
                  Olvidó su Contraseña?
                </a>
              </div>
              <div class="input-group input-group-merge">
                <input
                  type="password"
                  class="form-control bg-transparent border-1 border-secondary text-white"
                  name="pass_user"
                  id="pass_user"
                  placeholder="••••••••••••"
                  aria-describedby="togglePassword"
                  required
                  style="box-shadow: none;"
                />
                <span class="input-group-text cursor-pointer bg-transparent border-1 border-secondary text-white" id="togglePassword" onclick="togglePassword()">
                  <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                </span>
              </div>
            </div>

            <div class="mb-3">
              <button class="btn btn-primary w-100 fw-semibold" type="submit" style="border-radius: 50px;">
                Entrar ahora
                <i class="bi bi-arrow-right-circle ms-2"></i>
              </button>
            </div>
          </form>

          <p class="text-center text-white">
            ¿No tienes cuenta?
            <a href="./register-user" class="text-info text-decoration-none fw-semibold">Crear mi cuenta</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function togglePassword() {
    const input = document.getElementById('pass_user');
    const icon = document.getElementById('togglePasswordIcon');
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    } else {
      input.type = "password";
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    }
  }
</script>
